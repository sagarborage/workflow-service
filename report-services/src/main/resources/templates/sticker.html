<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{classpath:static/css/styles.css}" rel="stylesheet" type="text/css"/>
    <style>
        @page {
            size: 80mm 38mm; /* Adjust to your printer's page size */
            margin: 0; /* No margins for precise sticker printing */
        }

        .static-table {
            margin-top:10px;
            width: 76mm;
            height: 28mm;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .static-table td {
            border: 1.5px solid #000; /* Optional: for better visualization */
            overflow: hidden; /* Ensure content doesn't exceed the cell boundaries */
            text-align: center;
            vertical-align: middle;
        }

        /* Page break after each sticker */
        .sticker-page {
            page-break-after: always; /* Force a page break before each sticker */
        }
    </style>
</head>

<body>
<div th:each="stickerData : ${stickerDataList}" class="sticker-page">
    <div>
        <table class="alignCenter font-sans-serif font-w-500 font-s-14 static-table">
            <tr style="height: 44px;">
                <td class="alignCenter" style="width: 40%;" colspan="1">
                    <div class="margin-4">
                        <img th:src="@{classpath:static/images/ISO-logo.jpg}" height="55px" width="70px" alt="Logo" />
                    </div>
                </td>

                <td class="alignCenter" style="width: 60%;" colspan="2">
                    <div class="margin-t-3">
                        <img th:src="@{classpath:static/images/HG-sticker.jpg}" height="62px" width="220px" alt="Logo" />
                    </div>
                </td>
            </tr>
            <tr style="height: 28px;">
                <td style="width: 40%;" colspan="1">
                <div class="font-s-16">
                    <span th:text="${stickerData.piNo}"></span>
                </div>
            </td>
                <td style="width: 40%;" colspan="2">TH:- <span th:text="${stickerData.thickness}"></span></td>
            </tr>
            <tr style="height: 28px;">
                <td style="width: 40%;" colspan="1">
                    <div class="font-s-16">
                        <span th:text="${stickerData.stickerNumber}"></span>
                    </div>
                </td>

                <td class="alignCenter" style="width: 30%;" colspan="1">
                    <div class="font-s-12">Size</div>
                    <div class="font-s-16"><span th:text="${stickerData.size}"></span></div>
                </td>
                <td class="alignCenter" style="width: 30%;" colspan="1">
                    <div class="font-s-12">Date</div>
                    <div class="font-s-16"><span th:text="${#dates.format(new java.util.Date(), 'dd-MM-yyyy')}"></span></div>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
