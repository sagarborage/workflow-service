<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{classpath:static/css/styles.css}" rel="stylesheet" type="text/css"/>

    <style>
        table {
        margin: 0 auto;
        margin-top: 0 auto;
        width: 30%;
        border-collapse: collapse;
        }
        .font-helva
        {
          font-family: 'Helvetica', sans-serif;
                    font-size: 14px;
        }
        td {
        border: 1px solid black;
        padding: 8px;
        }
        .alignCenter {
        text-align: center;
        }
        .alignLeft {
        text-align: left;
        }

    th, td {
      border: 1px solid black;
      padding: 0px;
      text-align: center;
      height: 20px; /* Adjust the height as needed */
    }
    </style>
</head>

<body>
<div style="overflow-x: auto;">
    <table class="alignCenter font-helva font-w-400 font-s-14">
        <tr>
            <td style="width: 20%;height: 30px" colspan="1">
                <span th:text="${stickerData.getPiNo()}"></span>
            </td>
            <td class="alignCenter font-12" style="width: 80%;height: 30px" colspan="2">
                <img th:src="@{classpath:static/images/HG-sticker.jpg}" height="40px" width="110px" alt="Logo"/>
            </td>
        </tr>
        <tr>
            <td style="width: 20%;" colspan="1">TH:- <span th:text="${stickerData.getThickness()}"></span></td>
            <td class="alignCenter font-12" style="width: 80%;" colspan="2">
                Party:- <span th:text="${stickerData.getPartyName()}"></span>
            </td>
        </tr>
        <tr>
            <td style="width: 30%;height: 30px" colspan="1">1/10</td>
            <td class="alignCenter font-12" style="width: 35%;height: 30px" colspan="1">
                Size <span th:text="${stickerData.getSize()}"></span>
            </td>
            <td class="alignCenter font-12" style="width: 35%;height: 30px" colspan="1">
                Date
                <span th:text="${#temporals.format(stickerData.getDate(), 'dd-MM-yy')}"></span>
            </td>

        </tr>
    </table>
</div>
</body>
</html>
