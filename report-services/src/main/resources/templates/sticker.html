<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{classpath:static/css/styles.css}" rel="stylesheet" type="text/css"/>
    <style>
        /* Define the page size for PDF generation */
               @page {
                   size: 70mm 35mm;  /* Custom size for each sticker page */
                   margin-top: 0.5mm;       /* Margin around the page */
                   margin-right: 0.5mm;       /* Margin around the page */
                   margin-bottom: 0.5mm;       /* Margin around the page */
                   margin-left: 1mm;       /* Margin around the page */
               }

               /* Styling for the sticker itself */
               .sticker {
                   border: 0.5mm solid black;
                   text-align: center;
                   padding: 0;
               }

               /* Table styling inside each sticker */
               table {
                    width: 68mm;
                    height: 33mm;
                   border-collapse: collapse;
               }

               td {
                   border: 0.5mm solid #000;
                   text-align: center;
                   vertical-align: middle;

               }

               body {
                   margin: 0;  /* Remove default margin */
               }
    </style>
</head>

<body>
<div th:each="stickerData : ${stickerDataList}">
    <div class="sticker">
        <table class="alignCenter font-sans-serif font-w-500 font-s-14 static-table">
            <tr style="height: 11mm;">
                <td class="alignCenter" colspan="1">
                    <div class="font-s-5">IS 2553:2018:Part 1</div>
                    <div class="alignCenter">
                        <img th:src="@{classpath:static/images/ISO-logo.jpg}" style="height: 6mm;" width="11mm" alt="Logo" />
                    </div>
                    <div class="font-s-5">CM/L 7500262816</div>
                    <div class="font-s-4">www.bsi.gov.in</div>
                </td>

                <td class="alignCenter" colspan="2">
                    <div class="alignCenter">
                        <img th:src="@{classpath:static/images/HG-sticker.jpg}" style="height: 10mm;" width="50mm" alt="Logo" />
                    </div>
                </td>
            </tr>
            <tr style="height: 9.35mm;">
                <td colspan="1">
                <div class="font-s-16">
                    <span th:text="${stickerData.piNo}"></span>
                </div>
            </td>
                <td colspan="2">TH:- <span th:text="${stickerData.thickness}"></span></td>
            </tr>
            <tr style="height: 11mm;">
                <td colspan="1">
                    <div class="font-s-16">
                        <span th:text="${stickerData.stickerNumber}"></span>
                    </div>
                </td>

                <td class="alignCenter" colspan="1">
                    <div class="font-s-12">Size</div>
                    <div class="font-s-16"><span th:text="${stickerData.size}"></span></div>
                </td>
                <td class="alignCenter" colspan="1">
                    <div class="font-s-12">Date</div>
                    <div class="font-s-16"><span th:text="${#dates.format(new java.util.Date(), 'dd-MM-yyyy')}"></span></div>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
